name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # ← ĐỔI thành windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pydivert pynput psutil colorama PyQt6 pycryptodome wmi pywin32 requests
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "Phedev" --hidden-import "Crypto" --hidden-import "wmi" menu.py
      
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Phedev-Windows
          path: dist/Phedev.exe
